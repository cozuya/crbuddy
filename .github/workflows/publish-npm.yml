name: Publish to npm

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/publish-npm.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'cozuya/crbuddy'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Check whether this version is already published
        id: version
        shell: bash
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "package=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if npm view "$name@$version" version --json >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version already exists on npm; skipping publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is not on npm; publishing."
          fi

      - name: Enable pnpm
        if: steps.version.outputs.publish == 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Publish package
        if: steps.version.outputs.publish == 'true'
        run: npm publish
