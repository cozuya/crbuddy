name: Run sept-14 review cleanup

on:
  push:
    branches:
      - sept-14
    paths:
      - .github/workflows/sept14-review-cleanup.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sept-14
        uses: actions/checkout@v6
        with:
          ref: sept-14

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Repair patch script brittle reviewer match
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('scripts/sept14-review-cleanup.py')
          s = p.read_text()
          needle = "text = replace_once(text, old, new, 'sanitize reviewer summary fields')"
          replacement = """reviewer_pattern = re.compile(
              r\"function formatReviewer\\(entry: PanelEntry\\): string \\{.*?\\n\\}\\n\\n(?=function formatPanel)\",
              re.S,
          )
          text, count = reviewer_pattern.subn(lambda _: new + '\\n', text, count=1)
          if count != 1:
              raise SystemExit(f'sanitize reviewer summary fields: expected 1 match, got {count}')"""
          if needle not in s:
              raise SystemExit('could not find reviewer replacement line in patch script')
          s = s.replace(needle, replacement, 1)
          p.write_text(s)
          PY

      - name: Apply patch
        run: python3 scripts/sept14-review-cleanup.py

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Commit fix and remove temporary patch files
        shell: bash
        run: |
          rm -f scripts/sept14-review-cleanup.py .github/workflows/sept14-review-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Address remaining sept-14 review findings'
          git push origin HEAD:sept-14
